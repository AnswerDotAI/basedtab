[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "basedtab"
dynamic = ["version"]
description = "Based Tabular Data"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [{name = "CarloLepelaars", email = "info@carlolepelaars.nl"}]
keywords = ['nbdev']
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "basedpl>=0.1.51",
]

[project.urls]
Repository = "https://github.com/AnswerDotAI/BasedTab"
Documentation = "https://AnswerDotAI.github.io/BasedTab/"

[project.entry-points.nbdev]
basedtab = "basedtab._modidx:d"

[tool.setuptools.dynamic]
version = {attr = "basedtab.__version__"}

[tool.setuptools.packages.find]
include = ["basedtab"]

[tool.nbdev]

[dependency-groups]
dev = [
    "pandas>=3.1.0",
]
