[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "BasedTab"
dynamic = ["version"]
description = "Based Tabular Data"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "CarloLepelaars", email = "info@carlolepelaars.nl"}]
keywords = ['nbdev']
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = []

[project.urls]
Repository = "https://github.com/AnswerDotAI/BasedTab"
Documentation = "https://AnswerDotAI.github.io/BasedTab/"

[project.entry-points.nbdev]
BasedTab = "BasedTab._modidx:d"

[tool.setuptools.dynamic]
version = {attr = "BasedTab.__version__"}

[tool.setuptools.packages.find]
include = ["BasedTab"]

[tool.nbdev]
